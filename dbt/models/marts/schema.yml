version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: dim_geography
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

  - name: fact_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: fact_payments
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id

  - name: fact_reviews
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
